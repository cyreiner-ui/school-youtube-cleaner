name: Rebuild signed CRX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore signing key
        shell: pwsh
        env:
          CRX_SIGNING_KEY_PEM: ${{ secrets.CRX_SIGNING_KEY_PEM }}
        run: |
          if (-not $env:CRX_SIGNING_KEY_PEM) { throw 'CRX_SIGNING_KEY_PEM is not configured.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'school-youtube-cleaner.pem'
          [System.IO.File]::WriteAllText($keyPath, $env:CRX_SIGNING_KEY_PEM)
          "SYC_SIGNING_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and validate
        run: |
          npm run build
          npm test
      - name: Commit updated Pages files
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if (git diff --cached --quiet) { Write-Host 'Pages files are already current.'; exit 0 }
          git commit -m "Build signed extension $((Get-Content manifest.json | ConvertFrom-Json).version)"
          git push
